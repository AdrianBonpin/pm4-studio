[package]
name = "pm4-studio"
version = "0.2.0"
description = "Reader/writer studio for the CYBDZKJ-BSJ / TCC-TSY-TBY (NFC-PM4) USB RFID reader"
authors = ["Adrian Bonpin"]
edition = "2021"
license = "MIT"
repository = "https://github.com/AdrianBonpin/pm4-studio"

[lib]
name = "pm4_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hidapi = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
